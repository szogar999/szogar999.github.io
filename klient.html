<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>OSG — Moje zamówienia</title>
<style>
:root{
  --ink:#111827; --ink-2:#4b5563; --ink-3:#9aa3b0;
  --bg:#f6f7f9; --card:#fff; --line:#e8eaee; --line-2:#f1f2f5;
  --osg:#e8601c; --osg-2:#ff8c42; --osg-soft:#fff1e9;
  --ok:#16a34a; --ok-soft:#e9f7ee;
  --wait:#f59e0b; --wait-soft:#fff6e6;
  --info:#2563eb; --info-soft:#eaf1fe;
  --r:18px; --r-sm:12px; --r-lg:26px;
  --sh:0 1px 2px rgba(17,24,39,.05),0 8px 24px rgba(17,24,39,.05);
  --sh-lg:0 2px 4px rgba(17,24,39,.06),0 16px 40px rgba(17,24,39,.09);
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 12px);}
button{font:inherit;color:inherit;}

/* ---------- pasek gorny ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
.top-in{max-width:600px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:11px;}
.mark{width:36px;height:36px;border-radius:11px;background:var(--osg);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.5px;}
.top-t{font-size:15px;font-weight:700;line-height:1.2;}
.top-s{font-size:12px;color:var(--ink-3);}
.back{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink-2);}
.back:active{transform:scale(.94);}

/* ---------- uklad ---------- */
.wrap{max-width:600px;margin:0 auto;padding:0 16px 28px;}
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px;padding:0 2px;}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);}
.sec-a{font-size:13px;font-weight:600;color:var(--osg);cursor:pointer;background:none;border:none;padding:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:18px;}
.card+.card{margin-top:12px;}
h1{margin:0;font-size:29px;line-height:1.15;font-weight:800;letter-spacing:-.7px;}
h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;}

/* ---------- hero aktywnej realizacji ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:22px 20px;overflow:hidden;position:relative;}
.hero::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--osg),var(--osg-2));}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:700;}
.pill.wait{background:var(--wait-soft);color:#a15c00;}
.pill.ok{background:var(--ok-soft);color:#0f7a37;}
.pill.info{background:var(--info-soft);color:#1d4ed8;}
.pill.mut{background:var(--bg);color:var(--ink-3);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 0 rgba(245,158,11,.6);animation:p 2s infinite;}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5);}70%{box-shadow:0 0 0 8px rgba(245,158,11,0);}100%{box-shadow:0 0 0 0 rgba(245,158,11,0);}}
.hero-h{margin:14px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15;}
.hero-s{color:var(--ink-2);font-size:14px;}
.hero-s b{color:var(--ink);}

/* ---------- przyciski ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);transition:.15s;}
.btn:active{transform:scale(.985);}
.btn.pri{background:var(--osg);border-color:var(--osg);color:#fff;
  box-shadow:0 6px 16px rgba(232,96,28,.28);}
.btn.sm{padding:11px;font-size:14px;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.btn-row.one{grid-template-columns:1fr;}

/* ---------- wiersze / listy ---------- */
.row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-2);
  cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;}
.row:last-child{border-bottom:none;}
.row.static{cursor:default;}
.row-ic{width:38px;height:38px;border-radius:11px;background:var(--bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column;}
.row-t{display:block;font-size:15px;font-weight:600;line-height:1.3;}
.row-s{display:block;font-size:13px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-v{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.chev{color:var(--ink-3);flex-shrink:0;}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:34px;}
.tl-i{position:relative;padding-bottom:22px;}
.tl-i:last-child{padding-bottom:0;}
.tl-i::before{content:'';position:absolute;left:-22px;top:22px;bottom:0;width:2px;background:var(--line);}
.tl-i:last-child::before{display:none;}
.tl-i.done::before{background:var(--ok);}
.tl-b{position:absolute;left:-34px;top:0;width:26px;height:26px;border-radius:50%;
  background:var(--card);border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;color:var(--ink-3);}
.tl-i.done .tl-b{background:var(--ok);border-color:var(--ok);color:#fff;}
.tl-i.now .tl-b{background:var(--osg);border-color:var(--osg);color:#fff;box-shadow:0 0 0 5px var(--osg-soft);}
.tl-n{font-size:15px;font-weight:700;line-height:1.3;}
.tl-i.todo .tl-n{color:var(--ink-3);font-weight:600;}
.tl-i.now .tl-n{color:var(--osg);}
.tl-d{font-size:13px;color:var(--ink-2);margin-top:2px;}

/* ---------- kwoty ---------- */
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;
  border-bottom:1px solid var(--line-2);}
.sum:last-child{border-bottom:none;}
.sum-k{font-size:14px;color:var(--ink-2);}
.sum-v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.sum.total{padding-top:13px;}
.sum.total .sum-k{font-weight:700;color:var(--ink);font-size:15px;}
.sum.total .sum-v{font-size:23px;font-weight:800;letter-spacing:-.5px;}

/* ---------- pozycje ---------- */
.li{display:flex;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-2);}
.li:last-child{border-bottom:none;}
.li-n{font-size:14px;font-weight:600;line-height:1.35;}
.li-q{font-size:13px;color:var(--ink-3);margin-top:2px;}
.li-v{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}

/* ---------- stany ---------- */
.skel{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--line-2) 25%,#fff 50%,var(--line-2) 75%);
  background-size:400% 100%;animation:sh 1.3s ease-in-out infinite;}
@keyframes sh{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skel.big{height:92px;border-radius:var(--r);}
.skel+.skel{margin-top:10px;}
.empty{text-align:center;padding:56px 24px;color:var(--ink-3);}
.empty-ic{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--ink-3);}
.empty-t{font-size:16px;font-weight:700;color:var(--ink-2);}
.empty-s{font-size:14px;margin-top:5px;}

/* ---------- dolny tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:var(--tab-h);border:none;background:none;cursor:pointer;color:var(--ink-3);
  font-size:10px;font-weight:600;transition:.15s;padding:0 2px;}
.tab.on{color:var(--osg);}
.tab:active{transform:scale(.94);}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2);}
.in{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 13px;
  font:inherit;font-size:15px;background:var(--card);color:var(--ink);outline:none;
  -webkit-appearance:none;appearance:none;}
.in:focus{border-color:var(--osg);box-shadow:0 0 0 3px var(--osg-soft);}
select.in{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%239aa3b0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:38px;}
textarea.in{min-height:84px;resize:vertical;line-height:1.5;}
.rq-row{margin-bottom:11px;padding-bottom:11px;border-bottom:1px dashed var(--line-2);}
.rq-row:last-child{border-bottom:none;padding-bottom:0;margin-bottom:6px;}
.rq-sub{display:grid;grid-template-columns:1fr 96px 1fr;gap:8px;align-items:center;margin-top:7px;}
.rq-row .in{padding:11px 12px;font-size:14px;}
.rq-name{font-weight:600;}
.rq-del{height:42px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-size:14px;font-weight:600;}
.rq-del:hover,.rq-del:active{border-color:#ef4444;color:#ef4444;background:#fef2f2;}
.rq-del-t{display:inline;}
@media(min-width:520px){
  .rq-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
    padding-bottom:0;border-bottom:none;margin-bottom:9px;}
  .rq-sub{margin-top:0;grid-template-columns:86px 92px 44px;}
  .rq-del-t{display:none;}
  .rq-del{width:44px;padding:0;}
}
.rq-add{width:100%;border:1px dashed var(--line);background:none;border-radius:var(--r-sm);
  padding:11px;color:var(--osg);font-weight:700;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;}
.err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:var(--r-sm);
  padding:11px 13px;font-size:14px;font-weight:600;margin-bottom:12px;}
.done-ic{width:78px;height:78px;border-radius:50%;background:var(--ok-soft);color:var(--ok);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
/* ---------- filtry list (orders / documents) ---------- */
.flt{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding:2px 2px 4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.flt::-webkit-scrollbar{display:none;}
.flt-b{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;}
.flt-b span{color:var(--ink-3);font-weight:700;margin-left:3px;}
.flt-b.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.flt-b.on span{color:rgba(255,255,255,.6);}
.flt-b:active{transform:scale(.96);}

/* ---------- wiersz listy: zamowienia i dokumenty ---------- */
.o-row{align-items:flex-start;padding:15px 0;}
.o-ic{margin-top:1px;}
.o-ic.d-fv{background:var(--osg-soft);color:var(--osg);}
.o-m{gap:0;}
.o-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.o-st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;line-height:1.4;}
.o-st.wait{background:var(--wait-soft);color:#a15c00;}
.o-st.ok{background:var(--ok-soft);color:#0f7a37;}
.o-st.info{background:var(--info-soft);color:#1d4ed8;}
.o-st.mut{background:var(--bg);color:var(--ink-3);}
.o-bld{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.35;margin-top:4px;}
.o-bot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:7px;}
.o-date{font-size:12px;color:var(--ink-3);white-space:nowrap;}
.o-val{font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.grp{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 2px 10px;}
.grp-t{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);}
.grp-n{font-size:12px;font-weight:700;color:var(--ink-3);}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 15px;margin-top:14px;box-shadow:var(--sh);}
.tot-k{font-size:13px;color:var(--ink-2);}
.tot-v{font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}

/* ---------- profil ---------- */
.pf-av{width:74px;height:74px;border-radius:50%;margin:0 auto;background:var(--osg-soft);color:var(--osg);
  display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;letter-spacing:-.5px;}
.pf-st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pf-s{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 8px;text-align:center;box-shadow:var(--sh);}
.pf-s b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px;}
.pf-s span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;}
a.btn{text-decoration:none;color:var(--ink);}
a.btn.pri{color:#fff;}

.foot{text-align:center;color:var(--ink-3);font-size:12px;padding:26px 10px 6px;line-height:1.6;}
@media(min-width:640px){ .wrap{padding-bottom:34px;} h1{font-size:32px;} }
</style>
</head>

  function pubOrder(o){
    return { id:o.id, number:o.number, status:o.status, building:o.building,
      createdAt:iso(dOff(o.createdOff)), acceptedAt:o.acceptedOff==null?null:iso(dOff(o.acceptedOff)),
      net:o.net, vat:o.vat, gross:o.gross, deliveryId:o.deliveryId,
      items:copy(o.items) };
  }
  function pubDelivery(d){
    if(!d)return null;
    return { orderId:d.orderId, status:d.status, address:d.address, hour:d.hour,
      date:iso(dOff(d.dayOff)), dayOff:d.dayOff, driver:d.driver, terms:d.terms,
      steps:copy(d.steps) };
  }

  /* Zgłoszenia złożone w tej przeglądarce. Trzymane lokalnie, żeby demo
     pokazywało pełny cykl: formularz → potwierdzenie → lista. Po demie ta
     sama metoda pójdzie do uwierzytelnionego endpointu zapisu. */
  var LS='osg_klient_zapotrzebowania';
  function localReqs(){
    try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; }
  }
  function saveLocal(list){
    try{ localStorage.setItem(LS,JSON.stringify(list.slice(-20))); }catch(e){}
  }
  function allRequests(){
    var seeded=DEMO.requests.map(function(r){
      return { id:r.id, number:r.number, status:r.status, createdAt:iso(dOff(r.createdOff)),
               building:r.building, note:r.note, items:copy(r.items) };
    });
    return localReqs().concat(seeded);
  }

  return {
    getRequests:function(){ return wait(allRequests()); },
    submitRequest:function(payload){
      var items=(payload.items||[]).filter(function(i){ return String(i[0]||'').trim(); });
      if(!items.length) return Promise.reject(new Error('Dodaj przynajmniej jedną pozycję.'));
      if(!String(payload.building||'').trim()) return Promise.reject(new Error('Wybierz budowę.'));
      var list=localReqs();
      var seq=1042+list.length;
      var rec={ id:'z-'+seq, number:'ZAP/2026/'+seq, status:'nowe',
        createdAt:iso(new Date()), building:String(payload.building),
        note:String(payload.note||''), items:copy(items) };
      list.push(rec); saveLocal(list);
      return wait(copy(rec));
    },
    getOrders:function(){
      var list=DEMO.orders.map(pubOrder);
      var counts={all:list.length};
      list.forEach(function(o){ counts[o.status]=(counts[o.status]||0)+1; });
      return wait({ orders:list, counts:counts });
    },
    getDocuments:function(){
      var byOrder={};
      DEMO.orders.forEach(function(o){ byOrder[o.id]=o; });
      var list=DEMO.documents.map(function(d){
        var o=byOrder[d.orderId]||{};
        /* Status wyprowadzony z danych, ktore juz sa w snapshocie.
           Faktura: brak danych o platnosci -> stwierdzamy tylko fakt wystawienia. */
        var st = d.type==='faktura' ? 'wystawiona'
               : (o.acceptedOff==null ? 'oczekuje' : 'zaakceptowana');
        return { id:d.id, type:d.type, number:d.number, date:iso(dOff(d.off)),
                 orderId:d.orderId, orderNumber:o.number||'', building:o.building||'',
                 gross:(o.gross==null?null:o.gross), status:st };
      }).sort(function(a,b){ return a.date<b.date?1:-1; });
      return wait(list);
    },
    getProfile:function(){
      return wait({ client:copy(DEMO.client),
        stats:{ orders:DEMO.orders.length, documents:DEMO.documents.length,
                requests:allRequests().length } });
    },
    getBuildings:function(){ return wait(copy(DEMO.client.buildings)); },
    getHome:function(){
      var active=DEMO.orders.filter(function(o){return o.status==='w_realizacji';})[0]||null;
      var pending=DEMO.orders.filter(function(o){return o.status==='do_akceptacji';})[0]||null;
      var reqs=allRequests();
      return wait({
        lastRequest:reqs.length?reqs[0]:null,
        client:copy(DEMO.client),
        active:active?pubOrder(active):null,
        activeDelivery:active?pubDelivery(DEMO.deliveries[active.deliveryId]):null,
        pending:pending?pubOrder(pending):null,
        recent:DEMO.orders.slice(0,3).map(pubOrder),
        counts:{ orders:DEMO.orders.length, documents:DEMO.documents.length }
      });
    },
    getOrder:function(id){
      var o=DEMO.orders.filter(function(x){return x.id===id;})[0];
      if(!o)return wait(null);
      return wait({ order:pubOrder(o),
        delivery:pubDelivery(DEMO.deliveries[o.deliveryId]),
        documents:DEMO.documents.filter(function(d){return d.orderId===id;})
          .map(function(d){return {id:d.id,type:d.type,number:d.number,date:iso(dOff(d.off))};}) });
    },
    getDelivery:function(orderId){
      var o=DEMO.orders.filter(function(x){return x.id===orderId;})[0];
      if(!o||!o.deliveryId)return wait(null);
      return wait({ order:pubOrder(o), delivery:pubDelivery(DEMO.deliveries[o.deliveryId]) });
    }
  };
})();

/* ============================================================
   Pomocnicze — formatowanie. Bez dostępu do danych.
   ============================================================ */
function zl(v){ return Number(v).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł'; }
function dOff(n){ var d=new Date(); d.setDate(d.getDate()+n); return d; }
function dLong(d){ return d.toLocaleDateString('pl-PL',{day:'numeric',month:'long'}); }
function dFromIso(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dPretty(iso){ return dLong(dFromIso(iso)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pl(n,a,b,c){ var d=n%10, e=n%100;
  if(n===1)return a; return (d>=2&&d<=4&&(e<10||e>=20))?b:c; }
function initials(name){
  var w=String(name||'').replace(/[^A-Za-z\u00C0-\u017F ]/g,' ').trim().split(/\s+/);
  return ((w[0]||'?').charAt(0)+(w[1]||'').charAt(0)).toUpperCase();
}
function monthLabel(isoStr){
  var d=dFromIso(isoStr);
  var t=d.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function relDay(off){
  if(off===0)return 'dziś';
  if(off===1)return 'jutro';
  if(off===-1)return 'wczoraj';
  return dLong(dOff(off));
}

      +'<input class="in rq-qty" type="number" step="any" min="0" placeholder="Ilość">'
      +'<select class="in rq-unit">'+units.map(function(u){return '<option value="'+u+'">'+u+'</option>';}).join('')+'</select>'
      +'<button class="rq-del" onclick="rqDelRow(this)" title="Usuń pozycję" aria-label="Usuń pozycję">'
        +ico('trash',16)+'<span class="rq-del-t">Usuń</span></button>'
    +'</div></div>';
}
function rqAddRow(){
  var box=document.getElementById('rq-items'); if(!box)return;
  box.insertAdjacentHTML('beforeend',rqRowHtml());
}
function rqDelRow(btn){
  var box=document.getElementById('rq-items');
  if(box&&box.children.length>1) btn.closest('.rq-row').remove();
}
async function rqSubmit(){
  var err=document.getElementById('rq-err'), btn=document.getElementById('rq-send');
  err.style.display='none';
  var items=[].map.call(document.querySelectorAll('#rq-items .rq-row'),function(r){
    return [ r.querySelector('.rq-name').value.trim(),
             parseFloat(r.querySelector('.rq-qty').value)||0,
             r.querySelector('.rq-unit').value ];
  });
  btn.disabled=true; btn.style.opacity='.6';
  try{
    var rec=await api.submitRequest({
      building:document.getElementById('rq-building').value,
      note:document.getElementById('rq-note').value,
      items:items
    });
    go('#/request/sent/'+rec.id);
  }catch(e){
    err.textContent=e.message; err.style.display='block';
    btn.disabled=false; btn.style.opacity='';
    window.scrollTo(0,0);
  }
}

views.requestSent=async function(id){
  paintTop({title:'Zapotrzebowanie wysłane',sub:'Potwierdzenie'});
  var reqs=await api.getRequests();
  var r=reqs.filter(function(x){return x.id===id;})[0];
  if(!r){ mount(emptyState('Nie znaleziono zgłoszenia','Wróć i spróbuj ponownie.')); return; }
  var h=[];
  h.push('<div class="sec" style="margin-top:34px;text-align:center;">'
    +'<div class="done-ic">'+ico('check',34,3)+'</div>'
    +'<h1>Zapotrzebowanie wysłane</h1>'
    +'<div style="color:var(--ink-2);margin-top:8px;">Numer zgłoszenia <b>'+esc(r.number)+'</b><br>'
    +'Opiekun przygotuje wycenę i odeśle ofertę.</div></div>');
  h.push('<div class="sec"><div class="card">'
    +infoRow('pin','Budowa',esc(r.building))
    +infoRow('box','Pozycje',r.items.length+' '+pl(r.items.length,'pozycja','pozycje','pozycji'))
    +infoRow('clock','Status',(REQ_STATUS[r.status]||REQ_STATUS.nowe).t)

    +r.items.map(function(i){
      return '<div class="li"><div><div class="li-n">'+esc(i[0])+'</div>'
        +'<div class="li-q">'+i[1]+' '+esc(i[2])+'</div></div></div>'; }).join('')
    +'</div></div>');

    +'<button class="btn pri" onclick="go(\'#/\')">Wróć na start</button>'
    +'<button class="btn" onclick="go(\'#/request\')">Nowe zgłoszenie</button>'
    +'</div></div>');
  mount(h.join(''));
};

/* ---------- Lista zamowien ---------- */
var ORD_FILTERS=[['all','Wszystkie'],['w_realizacji','W realizacji'],
  ['do_akceptacji','Do akceptacji'],['dostarczone','Dostarczone'],['archiwalne','Zakończone']];
var ordFilter='all', ordCache=null;

views.orders=async function(){
  paintTop({title:'Moje zamówienia',sub:'Historia współpracy'});
  mount('<div class="sec"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>');
  ordCache=await api.getOrders();
  var n=ordCache.orders.length;
  var suma=ordCache.orders.reduce(function(a,o){return a+o.gross;},0);
  mount('<div class="sec" style="margin-top:18px;"><h1>Zamówienia</h1>'
    +'<div style="color:var(--ink-2);margin-top:4px;">'+n+' '+pl(n,'zamówienie','zamówienia','zamówień')+' w historii współpracy</div>'
    +'<div class="tot"><span class="tot-k">Łączna wartość brutto</span><span class="tot-v">'+zl(suma)+'</span></div>'
    +'</div>'
    +'<div class="flt" id="ord-flt"></div>'
    +'<div class="sec" style="margin-top:6px;" id="ord-list"></div>'
    +'<div class="foot">Kliknij zamówienie, żeby zobaczyć pozycje i dokumenty.</div>');
  ordPaint();
};
function ordPaint(){
  var f=document.getElementById('ord-flt'), l=document.getElementById('ord-list');
  if(!f||!l||!ordCache)return;
  f.innerHTML=ORD_FILTERS.filter(function(x){ return x[0]==='all'||ordCache.counts[x[0]]; })
    .map(function(x){
      var c=x[0]==='all'?ordCache.counts.all:ordCache.counts[x[0]];
      return '<button class="flt-b'+(ordFilter===x[0]?' on':'')+'" onclick="ordSet(\''+x[0]+'\')">'
        +x[1]+' <span>'+c+'</span></button>'; }).join('');
  var rows=ordCache.orders.filter(function(o){ return ordFilter==='all'||o.status===ordFilter; });
  if(!rows.length){ l.innerHTML=emptyState('Brak zamówień','W tej kategorii nie ma jeszcze zamówień.'); return; }
  if(ordFilter!=='all'){ l.innerHTML='<div class="card">'+rows.map(orderRow).join('')+'</div>'; return; }
  var akt=rows.filter(function(o){ return o.status==='w_realizacji'||o.status==='do_akceptacji'; });
  var zak=rows.filter(function(o){ return o.status==='dostarczone'||o.status==='archiwalne'; });
  l.innerHTML=grupa('W toku',akt)+grupa('Zakończone',zak);
}
function grupa(t,arr){
  if(!arr.length) return '';
  return '<div class="grp"><span class="grp-t">'+t+'</span><span class="grp-n">'+arr.length+'</span></div>'
    +'<div class="card">'+arr.map(orderRow).join('')+'</div>';
}
function ordSet(f){ ordFilter=f; ordPaint(); }

/* ---------- Dokumenty ---------- */
var DOC_STATUS={
  zaakceptowana:{t:'Zaakceptowana',c:'ok'},
  oczekuje:{t:'Czeka na akceptację',c:'info'},
  wystawiona:{t:'Wystawiona',c:'mut'}
};
var DOC_FILTERS=[['all','Wszystkie'],['oferta','Oferty'],['faktura','Faktury']];
var docFilter='all', docCache=null;

views.documents=async function(){
  paintTop({title:'Dokumenty',sub:'Oferty i faktury'});
  mount('<div class="sec"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>');
  docCache=await api.getDocuments();
  var n=docCache.length, fv=docCache.filter(function(d){return d.type==='faktura';}).length;
  mount('<div class="sec" style="margin-top:18px;"><h1>Dokumenty</h1>'
    +'<div style="color:var(--ink-2);margin-top:4px;">'+n+' '+pl(n,'dokument','dokumenty','dokumentów')+' powiązanych z Twoimi zamówieniami</div>'
    +'<div class="tot"><span class="tot-k">Ostatni dokument</span><span class="tot-v" style="font-size:14px;">'
      +esc(docCache[0].number)+' · '+dPretty(docCache[0].date)+'</span></div>'
    +'</div>'
    +'<div class="flt" id="doc-flt"></div>'
    +'<div class="sec" style="margin-top:6px;" id="doc-list"></div>'
    +'<div class="foot">Pobieranie plików PDF udostępnimy w kolejnej wersji portalu.</div>');
  docPaint();
};
function docPaint(){
  var f=document.getElementById('doc-flt'), l=document.getElementById('doc-list');
  if(!f||!l||!docCache)return;
  f.innerHTML=DOC_FILTERS.map(function(x){
    var c=x[0]==='all'?docCache.length:docCache.filter(function(d){return d.type===x[0];}).length;
    return '<button class="flt-b'+(docFilter===x[0]?' on':'')+'" onclick="docSet(\''+x[0]+'\')">'
      +x[1]+' <span>'+c+'</span></button>'; }).join('');
  var rows=docCache.filter(function(d){ return docFilter==='all'||d.type===docFilter; });
  if(!rows.length){ l.innerHTML=emptyState('Brak dokumentów','W tej kategorii nie ma jeszcze dokumentów.'); return; }
  var out='', biezacy='';
  rows.forEach(function(d,i){
    var m=monthLabel(d.date);
    if(m!==biezacy){
      if(biezacy) out+='</div>';
      out+='<div class="grp"><span class="grp-t">'+esc(m)+'</span></div><div class="card">';
      biezacy=m;
    }
    out+=docRow(d);
  });
  if(biezacy) out+='</div>';
  l.innerHTML=out;
}
function docSet(f){ docFilter=f; docPaint(); }
function docRow(d){
  var fv = d.type==='faktura', st=DOC_STATUS[d.status]||DOC_STATUS.wystawiona;
  return '<button class="row o-row" onclick="go(\'#/orders/'+d.orderId+'\')">'
    +'<span class="row-ic o-ic'+(fv?' d-fv':'')+'">'+ico('file',17)+'</span>'
    +'<span class="row-m o-m">'
      +'<span class="o-top"><span class="row-t">'+esc(d.number)+'</span>'
        +'<span class="o-st '+st.c+'">'+st.t+'</span></span>'
      +'<span class="o-bld">'+(fv?'Faktura VAT':'Oferta')+' do '+esc(d.orderNumber)
        +'<br>'+esc(d.building)+'</span>'
      +'<span class="o-bot"><span class="o-date">'+dPretty(d.date)+'</span>'
        +'<span class="o-val">'+(d.gross==null?'—':zl(d.gross))+'</span></span>'
    +'</span>'
    +'<span class="chev">'+ico('chev',16)+'</span></button>';
}

/* ============================================================
   Shell + router
   ============================================================ */
function mount(html){ document.getElementById('app').innerHTML=html; }
function paintTop(o){
  document.getElementById('top').innerHTML=
    (o.back?'<button class="back" onclick="go(\''+o.back+'\')">'+ico('back',18)+'</button>'
           :'<div class="mark">OSG</div>')
    +'<div style="flex:1;min-width:0;"><div class="top-t">'+esc(o.title)+'</div>'
    +'<div class="top-s">'+esc(o.sub||'')+'</div></div>';
}
var TABS=[
  ['#/','Start','home'],
  ['#/orders','Zamówienia','box'],
  ['#/request','Zapotrzeb.','plus'],
  ['#/documents','Dokumenty','file'],
  ['#/profile','Profil','user']
];
function paintTabs(active){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab'+(t[0]===active?' on':'')+'" onclick="go(\''+t[0]+'\')">'
      +ico(t[2],20)+'<span>'+t[1]+'</span></button>'; }).join('');
}
function go(hash){ if(location.hash===hash) route(); else location.hash=hash; }

var ROUTES=[
  [/^#\/$/,                          function(){ paintTabs('#/');          return views.home(); }],
  [/^#\/orders\/([\w-]+)\/delivery$/,function(m){ paintTabs('#/orders');   return views.delivery(m[1]); }],
  [/^#\/orders\/([\w-]+)$/,          function(m){ paintTabs('#/orders');   return views.order(m[1]); }],
  [/^#\/orders$/,                    function(){ paintTabs('#/orders');    return views.orders(); }],
  [/^#\/request\/sent\/([\w-]+)$/,    function(m){ paintTabs('#/request');  return views.requestSent(m[1]); }],
  [/^#\/request$/,                   function(){ paintTabs('#/request');   return views.request(); }],
  [/^#\/documents$/,                 function(){ paintTabs('#/documents'); return views.documents(); }],
  [/^#\/profile$/,                   function(){ paintTabs('#/profile');   return views.profile(); }]
];
function route(){
  var h=location.hash||'#/';
  window.scrollTo(0,0);
  for(var i=0;i<ROUTES.length;i++){
    var m=h.match(ROUTES[i][0]);
    if(m){ ROUTES[i][1](m); return; }
  }
  location.hash='#/';
}
window.addEventListener('hashchange',route);
if(!location.hash) location.hash='#/'; else route();
</script>
